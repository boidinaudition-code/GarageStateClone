<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Schéma électrique V1 émetteur un seul capteur SAS308 D6 GND, D7 libre">
<rect width="1200" height="650" fill="#f7fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#20344d} .h{font-weight:bold;font-size:26px}.s{font-weight:bold;font-size:20px}.m{font-size:17px}.note{font-size:16px;fill:#607286}</style>
<rect x="25" y="24" width="1150" height="84" rx="12" fill="#183651"/>
<text x="50" y="61" class="h" style="fill:white">ÉMETTEUR — 1 SEUL SAS308 (FIN DE COURSE FERMÉE)</text>
<text x="50" y="89" class="note" style="fill:#ddeaf5">LoRa direct 868 MHz · aucun raccordement au moteur · alimentation USB-C 5 V</text>
<rect x="40" y="148" width="396" height="399" rx="14" fill="white" stroke="#a9c0d2" stroke-width="2"/>
<rect x="458" y="148" width="700" height="399" rx="14" fill="white" stroke="#a9c0d2" stroke-width="2"/>
<text x="68" y="189" class="s">XIAO nRF52840 + Wio SX1262</text>
<rect x="96" y="220" width="289" height="275" rx="8" fill="#eaf2fa"/>
<text x="128" y="257" class="m">USB-C 5 V (alimentation)</text>
<text x="128" y="332" class="s">D6 / P1.11</text>
<text x="128" y="409" class="s">D7 / P1.12</text>
<text x="128" y="479" class="s">GND</text>
<text x="482" y="192" class="s">SAS308 + AIMANT (FERMÉ UNIQUEMENT)</text>
<text x="482" y="223" class="note">Boîtier 24 × 15 × 6 mm ; 250 mm de câble ; aimant à moins de 15 mm.</text>
<path d="M385 327 H540" stroke="#2161a1" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="540" cy="327" r="5" fill="#2161a1"/>
<path d="M545 327 L714 303" stroke="#2161a1" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="718" cy="327" r="5" fill="#2161a1"/>
<path d="M718 327 H1026 V472 H385" stroke="#334155" stroke-width="4" fill="none" stroke-linejoin="round"/>
<path d="M385 402 H538" stroke="#94a3b8" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
<text x="553" y="409" class="m">NON RACCORDE V1</text>
<text x="480" y="505" class="m">Aimant en face → CONTACT FERMÉ → GPIO à LOW</text>
<text x="480" y="530" class="note">Aimant absent → GPIO à HIGH (pull-up) → ouverture seulement ESTIMÉE après 40 s.</text>
<rect x="40" y="569" width="1118" height="55" rx="9" fill="#fff2e6" stroke="#e9c79a"/>
<text x="66" y="593" class="m">ATTENTION : aucune liaison à la tension secteur ou aux sorties de commande du moteur.</text>
<text x="66" y="615" class="note">Le SAS308 est uniquement un contact sec et ce montage n'assure PAS une confirmation d'ouverture.</text>
</svg>