<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="412" viewBox="0 0 1110 412" role="img" aria-label="Garage miniature V1 : ferme, transition, ouvert avec une LED orange en facade et une LED blanche interieure">
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1f2937}.heading{font-size:19px;font-weight:700}.sub{font-size:13px;fill:#64748b}.small{font-size:12px;fill:#374151}.frame{fill:#fafaf9;stroke:#ddd6ce}.wall{fill:#f3f2f1;stroke:#bcc2ca;stroke-width:2}.roof{fill:#18181b}.door{fill:#23252b}.line{stroke:#3f444d;stroke-width:2}.blue{stroke:#1858cf;stroke-width:4}.lamp{fill:#f59e0b;stroke:#b45309;stroke-width:2}.inner{fill:#42372c}.whiteled{fill:#ffe8b6}</style>
<rect width="1110" height="412" rx="16" fill="#fff"/>
<text x="34" y="32" class="heading" font-size="23">GarageStateClone — deux LED, design retenu</text>
<text x="34" y="53" class="sub">Façade blanche · toit et porte noirs · filet bleu · voyant orange discret</text>
<g transform="translate(30 72)"><rect width="335" height="296" rx="14" class="frame"/><text x="20" y="30" class="heading">01 · Fermé</text><text x="20" y="52" class="sub">Les deux LED sont éteintes</text>
