<g transform="translate(389 72)"><rect width="335" height="296" rx="14" class="frame"/><text x="20" y="30" class="heading">02 · Mouvement</text><text x="20" y="52" class="sub">Orange clignotant · blanc éteint</text>
<path d="M53 111 L100 93 H282 L239 112" fill="#343438"/><rect x="53" y="111" width="229" height="151" rx="3" class="wall"/><rect x="80" y="139" width="168" height="123" fill="#111827"/><path d="M80 138H248" class="blue"/><path d="M48 107H287V120H48Z" class="roof"/><path d="M82 158L244 158L220 206L103 206Z" fill="#292c33" stroke="#70757f" stroke-width="2"/><path d="M90 167L233 167 M100 181L228 181 M107 193L223 193" class="line"/><circle cx="258" cy="149" r="5" class="lamp"/><path d="M257 137V130 M269 148H277 M248 137L243 132" stroke="#f59e0b" stroke-width="2"/><text x="52" y="282" class="small">Orange : FLASH · Blanc : OFF</text></g>
<g transform="translate(748 72)"><rect width="335" height="296" rx="14" class="frame"/><text x="20" y="30" class="heading">03 · Ouvert</text><text x="20" y="52" class="sub">Intérieur blanc chaud éclairé</text>
<path d="M53 111 L100 93 H282 L239 112" fill="#343438"/><rect x="53" y="111" width="229" height="151" rx="3" class="wall"/><rect x="80" y="139" width="168" height="123" class="inner"/><path d="M80 138H248" class="blue"/><path d="M48 107H287V120H48Z" class="roof"/><rect x="122" y="150" width="76" height="7" rx="3" class="whiteled"/><path d="M118 158L202 158L248 253H80Z" fill="#ffe2ac" opacity=".35"/><path d="M85 254H243" stroke="#e9b85f" stroke-width="2"/><circle cx="258" cy="149" r="5" class="lamp"/><text x="52" y="282" class="small">Orange : FIXE · Blanc : ON</text></g>
<text x="30" y="396" class="sub">Illustration des états lumineux uniquement — mécanisme réel : porte rigide pivotant vers l'intérieur sous le toit (non représenté à l'échelle).</text>
