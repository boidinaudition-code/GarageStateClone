; XIAO nRF52840 + Wio-SX1262 — garage miniature LoRa
; Kit Seeed SKU 102010710 (carte Wio sur connecteurs 2x7)
; Voir README.md avant toute connexion.

[platformio]
name = Garage miniature LoRa
default_envs = emetteur

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    arduino-libraries/Servo @ ^1.2.2
build_flags =
    -DCFG_DEBUG=0

[env:emetteur]
build_flags =
    ${env.build_flags}
    -D ROLE_EMETTEUR=1
    -D OPEN_SENSOR_PRESENT=0
    -D SINGLE_SENSOR_OPEN_ESTIMATE_MS=40000UL

[env:recepteur]
build_flags =
    ${env.build_flags}
    -D ROLE_RECEPTEUR=1
