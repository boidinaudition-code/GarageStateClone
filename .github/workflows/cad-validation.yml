name: CAD - verifier et exporter STEP/STL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer CadQuery et Trimesh
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cadquery==2.8.0' 'trimesh==4.11.1'

      - name: Generer les STEP et STL a partir des BREP du depot
        run: |
          python cad/generate_cad.py
          python cad/generate_fit_coupons.py

      - name: Controler l'integrite du modele et des exports
        run: |
          python cad/qa_geometry.py
          python cad/verify_gotronic.py
          python cad/test_step_exports.py
          python cad/test_hardware_bom.py
          python cad/test_component_dimensions_sources.py
          python cad/test_fit_coupons.py
          python cad/test_repo_consistency.py

      - name: Archiver les 16 STEP, 13 STL, 4 coupons et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-state-clone-cad-step-stl
          path: |
            cad/step/*.step
            cad/stl/*.stl
            cad/coupons/*.stl
            cad/metriques_validation.json
            cad/qa_report_runtime.json
          if-no-files-found: warn
          retention-days: 30

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer PlatformIO
        run: python -m pip install 'platformio>=6.1,<7'
      - name: Compiler emetteur LoRa
        run: pio run -e emetteur
      - name: Compiler recepteur LoRa
        run: pio run -e recepteur
      - name: Archiver les firmwares
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: garage-state-clone-firmware-compile
          path: |
            .pio/build/emetteur/firmware.*
            .pio/build/recepteur/firmware.*
          if-no-files-found: error
          retention-days: 30
