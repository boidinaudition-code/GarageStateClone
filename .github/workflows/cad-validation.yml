name: CAD - verifier et exporter STEP/STL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer CadQuery et Trimesh
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cadquery==2.8.0' 'trimesh==4.11.1'

      - name: Generer les STEP et STL a partir des BREP du depot
        run: python cad/generate_cad.py

      - name: Controler l'integrite du modele et des exports
        run: |
          python cad/qa_geometry.py
          python cad/verify_gotronic.py
          python cad/test_step_exports.py

      - name: Archiver les 10 STEP, 9 STL et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-state-clone-cad-step-stl
          path: |
            cad/step/*.step
            cad/stl/*.stl
            cad/metriques_validation.json
            cad/qa_report_runtime.json
          if-no-files-found: warn
          retention-days: 30
